# Everything goes to the UI's nginx, which proxies /api, the two Actuator paths and the realm's public paths itself.
# Strict-Transport-Security belongs here when TLS ends at the Ingress (an annotation of your controller).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crud-ui-blueprint
  labels:
    app.kubernetes.io/name: crud-ui-blueprint
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: my-app
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crud-ui-blueprint
                port:
                  number: 8080
