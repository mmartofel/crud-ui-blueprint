# Developer > Topology: the runtime icon, the arrows to what the UI calls (each repo declares only its own outgoing
# arrows, docs/DEPLOY-CONVENTION.md) and the source code link. Deployment metadata only: the selector is immutable.
# The version label comes from `skaffold run --label app.kubernetes.io/version=<commit>` (README "Deploy").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-ui-blueprint
  labels:
    app.openshift.io/runtime: nginx
  annotations:
    app.openshift.io/connects-to: >-
      [{"apiVersion":"apps/v1","kind":"Deployment","name":"my-api"},
      {"apiVersion":"apps/v1","kind":"Deployment","name":"keycloak"}]
    app.openshift.io/vcs-uri: https://github.com/mmartofel/crud-ui-blueprint
